[project]
name = "aiodns"
dynamic = ["version"]
requires-python = ">=3.10"
readme.content-type = "text/x-rst"
readme.file = "README.rst"
license = "MIT"
description = "Simple DNS resolver for asyncio"
authors = [
    { name = "Saúl Ibarra Corretgé", email = "s@saghul.net" }
]
classifiers=[
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Developers',
    'Operating System :: POSIX',
    'Operating System :: Microsoft :: Windows',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
dependencies = [
    "pycares>=5.0.0,<6",
]

# TODO: Figure out how to make POSIX and Microsoft Windows
# attributes appear in the platforms informaiton.
# platfroms=["POSIX", "Microsoft Windows"]

[tool.setuptools.dynamic]
version = {attr = "aiodns.__version__"}

[build-system]
# pycares required because of the fact that it's in the __init__ module
requires = ["setuptools", "pycares"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Disables inclusion of non-package data (like tests) in the wheel if they are in the sdist
include-package-data = false

[tool.setuptools.packages.find]
exclude = ["tests*", "test_*"]
include = ["aiodns*"]

[project.urls]
    repository = "https://github.com/aio-libs/aiodns.git"

[tool.mutmut]
source_paths = ["aiodns"]
pytest_add_cli_args_test_selection = [
    "tests/test_aiodns.py",
    "-k",
    "test_callback_done_future or test_query_callback_done_future or test_gethostbyname_callback_done_future or test_resolver_cancel_pending_queries or test_cancel_between_callback_scheduling_and_execution or test_partial_future_cancellation or test_sync_ares_error_after_scheduled_callback or test_wait_for_timeout_then_late_reply",
]
on_dependency_change = "rerun"
process_isolation = "forkserver"
pytest_add_cli_args = [
    "-p",
    "no:unraisableexception",
]
